<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Cà phê Sông Hương</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            line-height: 1.6;
            color: #333;
        }
        header {
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
            margin: 0 5px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .menu-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            box-sizing: border-box;
            background: #fff;
        }
        .card h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .card .gia {
            color: #d9534f;
            font-weight: bold;
        }
        .card.het-hang {
            background: #f5f5f5;
            color: #888;
        }
        .card.het-hang h3 {
            text-decoration: line-through;
        }
        .pagination {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 20px 0;
        }
        .pagination a, .pagination .current {
            padding: 6px 12px;
            border: 1px solid #ccc;
            text-decoration: none;
            border-radius: 4px;
            color: #333;
        }
        .pagination a:hover {
            background: #e9e9e9;
        }
        .pagination .current {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
            font-weight: bold;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    {% include "_navbar.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% include "_footer.html" %}
</body>
</html>
